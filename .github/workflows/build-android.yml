name: Build Alo Zayeat Android APK
# Triggered build requested for downloadable debug APK.

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: zayeat-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zayeat-Android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../alo-zayeat.apk
          cd ..
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest alo-zayeat.apk --clobber
          else
            gh release create android-latest alo-zayeat.apk --title "الو ضایعات - نسخه اندروید" --notes "آخرین نسخه قابل دانلود برنامه اندروید الو ضایعات" --target "$GITHUB_SHA"
          fi
