name: Website safety checks
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/website-checks.yml'
  pull_request:
    paths:
      - 'index.html'
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML and embedded JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('index.html').read_text(encoding='utf-8')
          assert '<html' in source and '</html>' in source
          assert 'lang="fa"' in source and 'dir="rtl"' in source
          assert 'function makeRequestAlertWav()' in source
          assert 'function startRequestInboxLive()' in source
          assert 'if(!requestPollingTimer)startRequestInboxLive()' in source
          assert "return parent?perms?.[parent]===true:false;" in source
          scripts = re.findall(r'<script\b([^>]*)>(.*?)</script>', source, re.S|re.I)
          for i,(attrs,body) in enumerate(scripts):
              if 'src=' in attrs or not body.strip(): continue
              with tempfile.NamedTemporaryFile(mode='w', suffix='.mjs', encoding='utf-8') as f:
                  f.write(body);f.flush()
                  subprocess.run(['node','--check',f.name],check=True)
          print('HTML markers and inline JavaScript syntax OK')
          PY
